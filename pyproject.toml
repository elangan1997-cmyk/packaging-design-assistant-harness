[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packaging-design-assistant"
version = "0.3.0"
description = "A local-first conversational harness for packaging structure, content, and CMF workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "甘政林"}]
dependencies = []

[project.scripts]
packaging-assistant = "packaging_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
